<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Keeper of the Last Light</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 700px at 50% 38%, #141b3d 0%, #070912 62%, #04050c 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #b9c2e0;
  }
  main { text-align: center; padding: 18px 10px 22px; }
  canvas {
    width: min(96vw, 960px);
    height: auto;
    aspect-ratio: 16 / 9;
    background: #0a0e24;
    border: 1px solid #26305a;
    border-radius: 10px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), 0 0 90px rgba(255, 179, 64, 0.07);
  }
  p { margin: 12px 0 0; font-size: 12.5px; letter-spacing: 0.14em; opacity: 0.62; }
</style>
</head>
<body>
<main>
  <canvas id="game" width="960" height="540"></canvas>
  <p>EMBERFALL · A LANTERN-KEEPER PLATFORMER · KEYBOARD + MOUSE</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
